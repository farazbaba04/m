<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Farazé Cloud Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { farazeGold: '#D4AF37', farazeDark: '#121212' } }
            }
        }
    </script>

    <style>
        html, body { overscroll-behavior: none; }

        /* Camera area (own video element, no heavy library UI) */
        #reader-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: #000; }
        #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

        /* Laser targeting box */
        #laser-box {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(212,175,55,0.9);
            border-radius: 10px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.38);
            transition: width .25s ease, height .25s ease, border-color .2s ease;
            overflow: hidden;
        }
        #laser-box .corner { position: absolute; width: 22px; height: 22px; border: 4px solid #D4AF37; }
        #laser-box .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 10px; }
        #laser-box .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 10px; }
        #laser-box .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 10px; }
        #laser-box .br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 10px; }
        #laser-line {
            position: absolute; left: 4%; width: 92%; height: 3px; top: 0;
            background: linear-gradient(90deg, transparent, #ff2a2a 20%, #ff6b6b 50%, #ff2a2a 80%, transparent);
            box-shadow: 0 0 12px 3px rgba(255,42,42,0.85), 0 0 28px 6px rgba(255,42,42,0.45);
            border-radius: 3px;
            animation: laserMove 1.4s ease-in-out infinite alternate;
        }
        @keyframes laserMove { from { top: 4%; } to { top: 94%; } }
        #laser-box.success { border-color: #22c55e; }
        #laser-box.success #laser-line { background: #22c55e; box-shadow: 0 0 14px 4px rgba(34,197,94,0.9); animation-play-state: paused; }

        #flash { position: absolute; inset: 0; background: rgba(34,197,94,0.4); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
        #flash.on { opacity: 1; transition: none; }

        .ctrl-btn { background: #1c1c1c; border: 1px solid #3f3f46; color: #e5e7eb; border-radius: 8px; padding: 8px 2px; font-size: 12px; font-weight: 600; transition: .15s; }
        .ctrl-btn:active { transform: scale(0.96); }
        .ctrl-btn.active { background: #D4AF37; color: #121212; border-color: #D4AF37; }
        input[type=range] { accent-color: #D4AF37; }
    </style>
</head>
<body class="bg-farazeDark text-white min-h-screen flex flex-col items-center pt-8 pb-8 font-sans">

    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="text-3xl font-bold text-farazeGold tracking-widest">FARAZÉ</h1>
        <p class="text-gray-400 text-sm mt-1">CLOUD SCANNER</p>
    </div>

    <!-- Step 1: Pairing Screen -->
    <div id="pairing-screen" class="w-11/12 max-w-sm bg-zinc-900 border border-farazeGold rounded-lg p-6 shadow-[0_0_15px_rgba(212,175,55,0.2)] text-center">
        <h2 class="text-xl mb-4 text-gray-200">Connect to PC</h2>
        <p class="text-sm text-gray-400 mb-4">PC par chalne wali script ka 4-digit code yahan likhein</p>
        <input type="tel" inputmode="numeric" maxlength="4" id="pc-code" placeholder="e.g., 1234" class="w-full p-3 rounded bg-black border border-gray-600 text-center text-xl font-bold text-farazeGold focus:border-farazeGold outline-none mb-4 tracking-widest">
        <button id="connect-btn" class="w-full bg-farazeGold text-black font-bold py-3 rounded hover:bg-yellow-500 transition">Connect Scanner</button>
        <p id="pair-error" class="text-red-500 text-sm mt-2 hidden">Invalid Code or PC not active</p>
    </div>

    <!-- Step 2: Scanner Screen -->
    <div id="scanner-screen" class="w-11/12 max-w-md bg-zinc-900 border border-farazeGold rounded-lg p-3 shadow-[0_0_15px_rgba(212,175,55,0.2)] hidden text-center">
        <p class="text-xs text-yellow-500 mb-2 font-semibold">Target box ke andar sirf wohi code rakhein jo scan krwana hai</p>

        <div id="reader-wrap">
            <video id="video" playsinline muted autoplay></video>
            <div id="laser-box" style="width:90%;height:38%;">
                <span class="corner tl"></span><span class="corner tr"></span>
                <span class="corner bl"></span><span class="corner br"></span>
                <div id="laser-line"></div>
            </div>
            <div id="flash"></div>
        </div>

        <div id="scan-status" class="mt-3 text-center text-gray-300 font-bold min-h-[24px]">Starting camera...</div>
        <div id="scan-type" class="text-xs text-gray-500 min-h-[16px]"></div>
        <div id="engine-info" class="text-[10px] text-zinc-600 min-h-[14px]"></div>

        <!-- Controls -->
        <div class="grid grid-cols-3 gap-2 mt-3">
            <button id="btn-torch" class="ctrl-btn">🔦 Torch</button>
            <button id="btn-switch" class="ctrl-btn">🔄 Camera</button>
            <button id="btn-quality" class="ctrl-btn">📷 1080p</button>
            <button id="btn-mode" class="ctrl-btn">▭ Wide Box</button>
            <button id="btn-sound" class="ctrl-btn active">🔊 Beep</button>
            <button id="btn-focus" class="ctrl-btn">🎯 Focus</button>
        </div>

        <div id="zoom-wrap" class="mt-3 hidden">
            <label class="text-xs text-gray-400 flex justify-between"><span>Zoom</span><span id="zoom-val">1x</span></label>
            <input id="zoom-range" type="range" min="1" max="1" step="0.1" value="1" class="w-full">
        </div>

        <!-- History -->
        <div class="mt-4 text-left">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-gray-400 font-semibold">RECENT SCANS</span>
                <button id="clear-history" class="text-xs text-gray-500 underline">Clear</button>
            </div>
            <ul id="history" class="text-xs space-y-1 max-h-32 overflow-y-auto"></ul>
        </div>
    </div>

    <!-- Firebase & Scanner Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ================= FIREBASE (UNCHANGED) =================
        const firebaseConfig = {
            apiKey: "AIzaSyDtQ9lQoAZj3A53vTptIDgjHZ-o1amWgZY",
            authDomain: "cloudscanner-19972.firebaseapp.com",
            projectId: "cloudscanner-19972",
            storageBucket: "cloudscanner-19972.firebasestorage.app",
            messagingSenderId: "638553139845",
            appId: "1:638553139845:web:3cf43e9f6121243df717ec",
            measurementId: "G-W5178WF80C",
            databaseURL: "https://cloudscanner-19972-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentSessionCode = "";

        document.getElementById('connect-btn').addEventListener('click', async () => {
            const code = document.getElementById('pc-code').value.trim();
            if(code.length !== 4) return alert("Please enter a valid 4-digit code");

            unlockAudio(); // user gesture: beep ke liye audio enable

            const sessionRef = ref(db, 'sessions/' + code);
            const snapshot = await get(sessionRef);

            if (snapshot.exists() && snapshot.val().status === "waiting") {
                currentSessionCode = code;
                await update(sessionRef, { status: "connected" });

                document.getElementById('pairing-screen').classList.add('hidden');
                document.getElementById('scanner-screen').classList.remove('hidden');
                startScanner();
            } else {
                document.getElementById('pair-error').classList.remove('hidden');
            }
        });

        // Firebase send (same logic: update sessions/<code> { barcode })
        function sendToPC(decodedText) {
            const sessionRef = ref(db, 'sessions/' + currentSessionCode);
            return update(sessionRef, { barcode: decodedText });
        }
        // ================= END FIREBASE =================


        // ================= AUDIO (beep) =================
        let audioCtx = null;
        let soundOn = true;

        function unlockAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function beep(ok = true) {
            if (!soundOn) return;
            try {
                unlockAudio();
                const now = audioCtx.currentTime;
                const tones = ok ? [[2400, 0, 0.09], [3000, 0.09, 0.11]] : [[300, 0, 0.25]];
                tones.forEach(([freq, start, dur]) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = ok ? 'square' : 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, now + start);
                    gain.gain.exponentialRampToValueAtTime(0.35, now + start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(now + start);
                    osc.stop(now + start + dur + 0.02);
                });
            } catch (e) {}
            if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 40, 80]);
        }

        // ================= DECODER ENGINES =================
        // 1) Native BarcodeDetector (hardware/GPU accelerated, Chrome Android / macOS) - sabse fast
        // 2) ZXing WebAssembly (C++ ZXing-cpp compiled) - har browser par (iPhone Safari, Windows, Firefox)
        let nativeDetector = null;
        let engine = "none";          // 'native' | 'wasm'
        let zxingReady = null;

        async function initNative() {
            if (!("BarcodeDetector" in window)) return false;
            try {
                const supported = await BarcodeDetector.getSupportedFormats();
                if (!supported.length) return false;
                nativeDetector = new BarcodeDetector({ formats: supported });
                return true;
            } catch (e) { return false; }
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src; s.async = true;
                s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        function loadZXing() {
            if (zxingReady) return zxingReady;
            zxingReady = (async () => {
                if (window.ZXingWASM) return true;
                const urls = [
                    "https://cdn.jsdelivr.net/npm/zxing-wasm@2/dist/iife/reader/index.js",
                    "https://fastly.jsdelivr.net/npm/zxing-wasm@2/dist/iife/reader/index.js",
                    "https://unpkg.com/zxing-wasm@2/dist/iife/reader/index.js",
                    "https://cdn.jsdelivr.net/npm/zxing-wasm@latest/dist/iife/reader/index.js"
                ];
                for (const u of urls) {
                    try { await loadScript(u); if (window.ZXingWASM) return true; } catch (e) {}
                }
                return false;
            })();
            return zxingReady;
        }

        // ================= SCANNER =================
        const video = document.getElementById('video');
        const wrap = document.getElementById('reader-wrap');
        const laserBox = document.getElementById('laser-box');
        const statusDiv = document.getElementById('scan-status');
        const typeDiv = document.getElementById('scan-type');
        const infoDiv = document.getElementById('engine-info');

        const MODES = ['wide', 'square', 'full'];
        const MODE_LABEL = { wide: '▭ Wide Box', square: '▢ Square Box', full: '⛶ Full Frame' };
        const BOX = { wide: { w: 0.9, h: 0.38 }, square: { w: 0.62, h: 0.62 }, full: { w: 1, h: 1 } };
        const QUALITY = [
            { label: '720p',  w: 1280, h: 720 },
            { label: '1080p', w: 1920, h: 1080 },
            { label: '4K',    w: 3840, h: 2160 }
        ];

        let modeIdx = 0;
        let qIdx = 1;
        let stream = null;
        let devices = [];
        let devIdx = -1;               // -1 = facingMode environment (default)
        let running = false;
        let busy = false;
        let frameNo = 0;
        let torchOn = false;
        let isSending = false;
        let lastText = "", lastTime = 0;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        function applyBox() {
            const m = MODES[modeIdx];
            laserBox.style.width = (BOX[m].w * 100) + "%";
            laserBox.style.height = (BOX[m].h * 100) + "%";
            laserBox.style.borderRadius = m === 'full' ? '0' : '10px';
            document.getElementById('btn-mode').textContent = MODE_LABEL[m];
        }

        async function startScanner() {
            applyBox();
            const hasNative = await initNative();
            if (hasNative) {
                engine = "native";
            } else {
                statusDiv.textContent = "Loading fast engine...";
                const ok = await loadZXing();
                if (!ok) {
                    statusDiv.innerHTML = '<span class="text-red-500">Scanner engine load nahi hua - internet check karein</span>';
                    return;
                }
                engine = "wasm";
            }
            await startCamera();
        }

        async function startCamera() {
            stopCamera();
            const q = QUALITY[qIdx];
            const videoC = {
                width: { ideal: q.w },
                height: { ideal: q.h },
                frameRate: { ideal: 30 }
            };
            if (devIdx >= 0 && devices[devIdx]) videoC.deviceId = { exact: devices[devIdx].deviceId };
            else videoC.facingMode = { ideal: "environment" };

            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoC });
            } catch (e) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
                } catch (e2) {
                    statusDiv.innerHTML = '<span class="text-red-500">Camera permission allow karein</span>';
                    return;
                }
            }

            video.srcObject = stream;
            try { await video.play(); } catch (e) {}

            try {
                const all = await navigator.mediaDevices.enumerateDevices();
                devices = all.filter(d => d.kind === 'videoinput');
            } catch (e) {}

            await tuneCamera();

            running = true;
            statusDiv.textContent = "Ready to scan...";
            const eng = engine === "native" ? "Native BarcodeDetector" : "ZXing WASM";
            infoDiv.textContent = eng + " • " + video.videoWidth + "x" + video.videoHeight;
            scheduleLoop();
        }

        function stopCamera() {
            running = false;
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            video.srcObject = null;
        }

        function getTrack() { return stream ? stream.getVideoTracks()[0] : null; }

        async function tuneCamera() {
            const track = getTrack();
            if (!track) return;
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            const adv = {};
            if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
            if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
            if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('continuous')) adv.whiteBalanceMode = 'continuous';
            if (Object.keys(adv).length) { try { await track.applyConstraints({ advanced: [adv] }); } catch (e) {} }

            const zoomWrap = document.getElementById('zoom-wrap');
            const zoomRange = document.getElementById('zoom-range');
            if (caps.zoom) {
                zoomRange.min = caps.zoom.min;
                zoomRange.max = caps.zoom.max;
                zoomRange.step = caps.zoom.step || 0.1;
                zoomRange.value = caps.zoom.min;
                document.getElementById('zoom-val').textContent = Number(caps.zoom.min).toFixed(1) + "x";
                zoomWrap.classList.remove('hidden');
            } else {
                zoomWrap.classList.add('hidden');
            }

            const torchBtn = document.getElementById('btn-torch');
            torchBtn.style.display = caps.torch ? '' : 'none';
            torchOn = false;
            torchBtn.classList.remove('active');
        }

        // ---- ROI: laser box ko camera pixels me convert karo (object-fit: cover math) ----
        function getROI() {
            const vw = video.videoWidth, vh = video.videoHeight;
            if (!vw || !vh) return null;
            const m = MODES[modeIdx];
            if (m === 'full') return { sx: 0, sy: 0, sw: vw, sh: vh };

            const cw = wrap.clientWidth, ch = wrap.clientHeight;
            const scale = Math.max(cw / vw, ch / vh);
            const ox = (vw * scale - cw) / 2;
            const oy = (vh * scale - ch) / 2;
            const bw = cw * BOX[m].w, bh = ch * BOX[m].h;
            const bx = (cw - bw) / 2, by = (ch - bh) / 2;

            let sx = (bx + ox) / scale, sy = (by + oy) / scale;
            let sw = bw / scale, sh = bh / scale;
            sx = Math.max(0, sx); sy = Math.max(0, sy);
            sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
            return { sx, sy, sw, sh };
        }

        // ---- Decode loop: har camera frame par, ek waqt me ek decode ----
        function scheduleLoop() {
            if (!running) return;
            if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
            else requestAnimationFrame(loop);
        }

        async function loop() {
            if (!running) return;
            if (!busy && !isSending && video.readyState >= 2) {
                busy = true;
                try { await tick(); } catch (e) {}
                busy = false;
            }
            scheduleLoop();
        }

        async function tick() {
            const roi = getROI();
            if (!roi || roi.sw < 20 || roi.sh < 20) return;
            frameNo++;

            // Full resolution use hota hai (native: 2560 px tak, wasm: 1600 px tak)
            const maxW = engine === "native" ? 2560 : 1600;
            const k = Math.min(1, maxW / roi.sw);
            const cw = Math.max(1, Math.round(roi.sw * k));
            const ch = Math.max(1, Math.round(roi.sh * k));
            if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
            ctx.drawImage(video, roi.sx, roi.sy, roi.sw, roi.sh, 0, 0, cw, ch);

            let text = "", fmt = "";

            if (engine === "native") {
                try {
                    const codes = await nativeDetector.detect(canvas);
                    if (codes.length) { text = codes[0].rawValue; fmt = codes[0].format; }
                } catch (e) {
                    // native fail -> wasm par switch
                    engine = "wasm";
                    infoDiv.textContent = "ZXing WASM • " + video.videoWidth + "x" + video.videoHeight;
                    loadZXing();
                    return;
                }
            } else {
                if (!window.ZXingWASM) return;
                const img = ctx.getImageData(0, 0, cw, ch);
                const results = await window.ZXingWASM.readBarcodes(img, {
                    formats: [],                        // saare formats
                    tryHarder: frameNo % 3 === 0,       // har 3rd frame deep scan, baqi fast
                    tryRotate: true,
                    tryInvert: frameNo % 6 === 0,
                    maxNumberOfSymbols: 1
                });
                const r = results.find(x => x.isValid !== false && x.text);
                if (r) { text = r.text; fmt = r.format; }
            }

            if (text) onScanSuccess(text, fmt);
        }

        // ================= ON SCAN =================
        function onScanSuccess(decodedText, fmt) {
            if (isSending) return;

            // same code ko 1.2 sec tak dobara na bhejein
            const now = Date.now();
            if (decodedText === lastText && now - lastTime < 1200) return;

            isSending = true;
            lastText = decodedText;
            lastTime = now;

            // Instant feedback: beep + laser green + flash
            beep(true);
            laserBox.classList.add('success');
            const flash = document.getElementById('flash');
            flash.classList.add('on');
            setTimeout(() => flash.classList.remove('on'), 60);

            sendToPC(decodedText).then(() => {
                statusDiv.innerHTML = '<span class="text-green-500">Sent: ' + escapeHtml(decodedText) + '</span>';
                typeDiv.textContent = fmt ? "Type: " + String(fmt).replace(/_/g, " ") : "";
                addHistory(decodedText, fmt);

                setTimeout(() => {
                    statusDiv.textContent = "Ready for next scan...";
                    laserBox.classList.remove('success');
                    isSending = false;
                }, 700);
            }).catch(() => {
                beep(false);
                statusDiv.innerHTML = '<span class="text-red-500">Send failed - internet check karein</span>';
                setTimeout(() => {
                    statusDiv.textContent = "Ready for next scan...";
                    laserBox.classList.remove('success');
                    lastText = "";
                    isSending = false;
                }, 1500);
            });
        }

        // ================= CONTROLS =================
        document.getElementById('zoom-range').addEventListener('input', async (e) => {
            const track = getTrack();
            const z = parseFloat(e.target.value);
            document.getElementById('zoom-val').textContent = z.toFixed(1) + "x";
            if (track) { try { await track.applyConstraints({ advanced: [{ zoom: z }] }); } catch (err) {} }
        });

        document.getElementById('btn-torch').addEventListener('click', async (e) => {
            const track = getTrack();
            if (!track) return;
            torchOn = !torchOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                e.currentTarget.classList.toggle('active', torchOn);
            } catch (err) { torchOn = !torchOn; }
        });

        document.getElementById('btn-switch').addEventListener('click', async () => {
            if (devices.length < 2) return;
            devIdx = (devIdx + 1) % devices.length;
            await startCamera();
        });

        document.getElementById('btn-quality').addEventListener('click', async (e) => {
            qIdx = (qIdx + 1) % QUALITY.length;
            e.currentTarget.textContent = "📷 " + QUALITY[qIdx].label;
            await startCamera();
        });

        document.getElementById('btn-mode').addEventListener('click', () => {
            modeIdx = (modeIdx + 1) % MODES.length;
            applyBox();
        });

        document.getElementById('btn-sound').addEventListener('click', (e) => {
            soundOn = !soundOn;
            e.currentTarget.classList.toggle('active', soundOn);
            e.currentTarget.textContent = soundOn ? "🔊 Beep" : "🔇 Mute";
            unlockAudio();
            if (soundOn) beep(true);
        });

        async function refocus() {
            const track = getTrack();
            if (!track) return;
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            if (caps.focusMode && caps.focusMode.includes('single-shot')) {
                try {
                    await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(() => track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 800);
                } catch (e) {}
            } else if (caps.focusMode && caps.focusMode.includes('continuous')) {
                try {
                    await track.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
                    setTimeout(() => track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}), 300);
                } catch (e) {}
            }
        }
        document.getElementById('btn-focus').addEventListener('click', refocus);
        wrap.addEventListener('click', refocus);

        // ================= HISTORY =================
        const historyEl = document.getElementById('history');
        function addHistory(text, fmt) {
            const li = document.createElement('li');
            li.className = "flex justify-between gap-2 bg-black/40 border border-zinc-800 rounded px-2 py-1";
            const left = document.createElement('span');
            left.className = "text-gray-200 break-all";
            left.textContent = text;
            const right = document.createElement('span');
            right.className = "text-gray-500 whitespace-nowrap";
            right.textContent = fmt ? String(fmt).replace(/_/g, " ") : "";
            li.append(left, right);
            historyEl.prepend(li);
            while (historyEl.children.length > 15) historyEl.lastChild.remove();
        }
        document.getElementById('clear-history').addEventListener('click', () => { historyEl.innerHTML = ""; });

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Tab hide ho to camera band, wapis aaye to chalu
        document.addEventListener('visibilitychange', async () => {
            if (!currentSessionCode) return;
            if (document.hidden) stopCamera();
            else await startCamera();
        });
    </script>
</body>
</html>
