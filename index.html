<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>📋 Approval System</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Request Approval Workflow System</p>
            <div id="alert" class="alert"></div>
            <form id="loginForm" onsubmit="loginUser(event)">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="link" style="margin-top: 20px;">
                <p style="font-size: 12px; color: #999;">⚠️ Accounts are created by administrator only.</p>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { loginUser } from './js/auth.js';
        window.loginUser = loginUser;
        
        // Check if already logged in
        const user = localStorage.getItem('user');
        if (user) {
            const userData = JSON.parse(user);
            if (userData.role === 'ADMIN') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
