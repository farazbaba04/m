<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farazé Cloud Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { farazeGold: '#D4AF37', farazeDark: '#121212' } }
            }
        }
    </script>
</head>
<body class="bg-farazeDark text-white h-screen flex flex-col items-center pt-10 font-sans">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-farazeGold tracking-widest">FARAZÉ</h1>
        <p class="text-gray-400 text-sm mt-1">CLOUD SCANNER</p>
    </div>

    <!-- Step 1: Pairing Screen -->
    <div id="pairing-screen" class="w-11/12 max-w-sm bg-zinc-900 border border-farazeGold rounded-lg p-6 shadow-[0_0_15px_rgba(212,175,55,0.2)] text-center">
        <h2 class="text-xl mb-4 text-gray-200">Connect to PC</h2>
        <p class="text-sm text-gray-400 mb-4">PC par chalne wali script ka 4-digit code yahan likhein</p>
        <input type="text" id="pc-code" placeholder="e.g., 1234" class="w-full p-3 rounded bg-black border border-gray-600 text-center text-xl font-bold text-farazeGold focus:border-farazeGold outline-none mb-4 tracking-widest">
        <button id="connect-btn" class="w-full bg-farazeGold text-black font-bold py-3 rounded hover:bg-yellow-500 transition">Connect Scanner</button>
        <p id="pair-error" class="text-red-500 text-sm mt-2 hidden">Invalid Code or PC not active</p>
    </div>

    <!-- Step 2: Scanner Screen -->
    <div id="scanner-screen" class="w-11/12 max-w-md bg-zinc-900 border border-farazeGold rounded-lg p-4 shadow-[0_0_15px_rgba(212,175,55,0.2)] hidden text-center">
        <p class="text-xs text-yellow-500 mb-2 font-semibold">Target box ke andar sirf wohi code rakhein jo scan krwana hai</p>
        <div id="reader" class="w-full rounded overflow-hidden bg-black"></div>
        <div id="scan-status" class="mt-4 text-center text-gray-300 font-bold">
            Ready to scan...
        </div>
    </div>

    <!-- Firebase & Scanner Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtQ9lQoAZj3A53vTptIDgjHZ-o1amWgZY",
            authDomain: "cloudscanner-19972.firebaseapp.com",
            projectId: "cloudscanner-19972",
            storageBucket: "cloudscanner-19972.firebasestorage.app",
            messagingSenderId: "638553139845",
            appId: "1:638553139845:web:3cf43e9f6121243df717ec",
            measurementId: "G-W5178WF80C",
            databaseURL: "https://cloudscanner-19972-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentSessionCode = "";
        let html5QrcodeScanner = null;

        document.getElementById('connect-btn').addEventListener('click', async () => {
            const code = document.getElementById('pc-code').value.trim();
            if(code.length !== 4) return alert("Please enter a valid 4-digit code");

            const sessionRef = ref(db, 'sessions/' + code);
            const snapshot = await get(sessionRef);

            if (snapshot.exists() && snapshot.val().status === "waiting") {
                currentSessionCode = code;
                await update(sessionRef, { status: "connected" });
                
                document.getElementById('pairing-screen').classList.add('hidden');
                document.getElementById('scanner-screen').classList.remove('hidden');
                startScanner();
            } else {
                document.getElementById('pair-error').classList.remove('hidden');
            }
        });

        // Small, Precise Laser-Style Targeting Box Function
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 25, 
                    // Box ka size chota (240px width aur 120px height) kar diya hai ta ke specific code target ho
                    qrbox: { width: 240, height: 120 },
                    videoConstraints: { facingMode: "environment" }
                }, 
                false
            );
            
            html5QrcodeScanner.render(onScanSuccess, (errorMessage) => {});
        }

        let isSending = false;
        function onScanSuccess(decodedText) {
            if(isSending) return;
            isSending = true;
            
            const statusDiv = document.getElementById('scan-status');
            const sessionRef = ref(db, 'sessions/' + currentSessionCode);
            
            update(sessionRef, { barcode: decodedText }).then(() => {
                statusDiv.innerHTML = `<span class="text-green-500">Sent: ${decodedText}</span>`;
                new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3').play();
                
                setTimeout(() => { 
                    statusDiv.innerHTML = "Ready for next scan...";
                    isSending = false;
                }, 1200); 
            });
        }
    </script>
    
    <style>
        #reader__dashboard_section_csr span button { background-color: #D4AF37 !important; color: #121212 !important; padding: 10px 20px !important; border-radius: 6px !important; border: none !important; font-weight: bold !important; margin-top: 12px !important; }
        #reader a { color: #D4AF37 !important; }
        #reader select { background-color: #222; color: #fff; padding: 5px; border-radius: 4px; border: 1px solid #D4AF37; }
        /* Scanner viewfinder box styling for precise targeting */
        #reader__scan_region { background: rgba(0,0,0,0.2); }
    </style>
</body>
</html>
